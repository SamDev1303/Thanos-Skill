name: Thanos E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: |
          chmod +x thanos.sh
          chmod +x install.sh
          chmod +x tests/e2e_test.sh

      - name: Run built-in test suite
        run: ./thanos.sh --test

      - name: Run E2E test suite
        run: bash tests/e2e_test.sh

      - name: Verify SKILL.md frontmatter
        run: |
          head -1 SKILL.md | grep -q '^---'
          grep -q 'name: thanos' SKILL.md
          echo "✓ SKILL.md frontmatter valid"

      - name: Verify all stone templates exist
        run: |
          for stone in SOUL REALITY POWER TIME SPACE MIND; do
            [ -f "templates/THANOS_${stone}.md" ] && echo "✓ $stone template OK"
          done
